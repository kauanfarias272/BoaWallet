<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoaWallet - Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
    }
    .container { padding: 2rem; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #334155;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      color: #3b82f6;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      display: inline-block;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p id="status">Redirecting to BoaWallet...</p>
    <div id="fallback" style="display:none">
      <p>If the app did not open automatically:</p>
      <a id="manual-link" href="#">Open BoaWallet</a>
    </div>
  </div>
  <script>
    // Grab query params + hash from Supabase redirect and forward to custom scheme
    var deepLink = 'io.boa.wallet://auth' + window.location.search + window.location.hash;

    // Try JS redirect (works in Chrome Custom Tab unlike 302)
    window.location.href = deepLink;

    // Fallback: show manual link after 3 seconds
    setTimeout(function() {
      document.getElementById('status').textContent = 'Tap below to open the app:';
      document.getElementById('fallback').style.display = 'block';
      document.getElementById('manual-link').href = deepLink;
    }, 3000);
  </script>
</body>
</html>
