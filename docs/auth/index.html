<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoaWallet - Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0a0a0a;
      color: #e2e8f0;
      text-align: center;
    }
    .container { padding: 2rem; max-width: 400px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #d0d0a0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo {
      width: 64px; height: 64px;
      background: #d0d0a0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-weight: bold;
      font-size: 28px;
      color: #0a0a0a;
    }
    a {
      color: #d0d0a0;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 1px solid #d0d0a0;
      border-radius: 12px;
      display: inline-block;
      margin-top: 1rem;
      font-weight: 600;
    }
    a:active { opacity: 0.7; }
    p { color: #999; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">B</div>
    <div class="spinner"></div>
    <p id="status">Retornando ao BoaWallet...</p>
    <div id="fallback" style="display: none;">
      <p>Se o app não abriu automaticamente, toque abaixo:</p>
      <a id="manual-link" href="#">Abrir BoaWallet</a>
    </div>
  </div>
  <script>
    // Grab query params + hash from Supabase redirect and forward to custom scheme
    var params = window.location.search + window.location.hash;
    var deepLink = 'io.boa.wallet://auth' + params;
    var status = document.getElementById('status');
    var manualLink = document.getElementById('manual-link');
    var fallback = document.getElementById('fallback');
    manualLink.href = deepLink;

    function openApp() {
      // Use location.replace for cleaner redirect
      window.location.replace(deepLink);
    }

    // Attempt 1: immediate
    openApp();
    // Attempt 2: after a short delay (some browsers need this)
    setTimeout(openApp, 300);
    // Attempt 3: final try
    setTimeout(openApp, 1000);

    // If page is still visible after 1.5s, show manual fallback
    setTimeout(function() {
      fallback.style.display = 'block';
      status.textContent = 'Toque abaixo para voltar ao app:';
    }, 1500);

    // Detect if the app opened successfully
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && status) {
        status.textContent = 'Voltando ao BoaWallet...';
      }
    });

    // Also try via intent:// scheme (more reliable on some Android versions)
    setTimeout(function() {
      if (!document.hidden) {
        try {
          var intentUrl = 'intent://auth' + params + '#Intent;scheme=io.boa.wallet;package=io.boa.wallet;end';
          window.location.href = intentUrl;
        } catch(e) {}
      }
    }, 2000);
  </script>
</body>
</html>
